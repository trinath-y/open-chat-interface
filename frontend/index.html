<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Direct Interface - Streaming Chat</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        /* Design System - Inspired by OpenCode's clean interface */
        :root {
            --primary: #0066ff;
            --primary-hover: #0052cc;
            --success: #00875a;
            --warning: #ff9800;
            --error: #de350b;
            --bg-main: #ffffff;
            --bg-secondary: #f7f8fa;
            --bg-tertiary: #ebecf0;
            --text-primary: #172b4d;
            --text-secondary: #6b778c;
            --border: #dfe1e6;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.15);
            --radius: 6px;
            --user-msg: #e3f2fd;
            --assistant-msg: #f5f5f5;
            --code-bg: #282c34;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #4c9aff;
                --primary-hover: #2684ff;
                --bg-main: #0d1117;
                --bg-secondary: #161b22;
                --bg-tertiary: #21262d;
                --text-primary: #c9d1d9;
                --text-secondary: #8b949e;
                --border: #30363d;
                --user-msg: #1f3a5f;
                --assistant-msg: #161b22;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Bar */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border-radius: 20px;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status.connected .status-dot {
            background: var(--success);
        }

        .status.connecting .status-dot {
            background: var(--warning);
        }

        .status.error .status-dot {
            background: var(--error);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        /* Message Styles */
        .message {
            margin-bottom: 20px;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .user-message .message-avatar {
            background: var(--primary);
            color: white;
        }

        .assistant-message .message-avatar {
            background: var(--bg-tertiary);
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .message-body {
            padding: 12px 16px;
            border-radius: var(--radius);
            line-height: 1.6;
            word-wrap: break-word;
        }

        .user-message .message-body {
            background: var(--user-msg);
            margin-right: 20%;
        }

        .assistant-message .message-body {
            background: var(--assistant-msg);
            margin-right: 10%;
        }

        /* Streaming Indicator */
        .streaming-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 8px;
        }

        .streaming-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: streamingPulse 1.4s infinite;
        }

        .streaming-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .streaming-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes streamingPulse {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            30% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Code Blocks */
        .message-body pre {
            background: var(--code-bg);
            padding: 16px;
            border-radius: var(--radius);
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-body code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 14px;
        }

        .message-body pre code {
            background: none;
            padding: 0;
        }

        /* Tool/Code Execution Indicator */
        .tool-execution {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--primary);
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: var(--radius);
            font-family: monospace;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-icon {
            font-size: 18px;
        }

        /* Input Area */
        .input-container {
            padding: 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.1);
        }

        .send-button {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .send-button:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Session Info Bar */
        .session-info {
            padding: 8px 20px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .session-stats {
            display: flex;
            gap: 20px;
        }

        /* Authentication Modal */
        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .auth-modal.show {
            display: flex;
        }

        .auth-content {
            background: var(--bg-main);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .auth-button {
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        /* Scrollbar Styling */
        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: var(--text-primary);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 10px 15px;
            }

            .messages {
                padding: 15px;
            }

            .user-message .message-body,
            .assistant-message .message-body {
                margin-right: 0;
            }

            .input-container {
                padding: 15px;
            }
        }
    </style>

    <!-- Additional syntax highlighting languages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <div class="logo">C</div>
            <span>Claude Direct Interface</span>
        </div>
        <div id="status" class="status connecting">
            <span class="status-dot"></span>
            <span class="status-text">Connecting...</span>
        </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container">
        <div id="messages" class="messages"></div>
    </div>

    <!-- Session Info Bar -->
    <div class="session-info">
        <div class="session-stats">
            <span>Session: <strong id="session-id">-</strong></span>
            <span>Messages: <strong id="message-count">0</strong></span>
        </div>
        <div>
            <span id="stream-status"></span>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea
                id="message-input"
                class="message-input"
                placeholder="Type your message to Claude... (Shift+Enter for new line)"
                rows="1"></textarea>
            <button id="send-button" class="send-button" disabled>
                <span>Send</span>
                <span>↵</span>
            </button>
        </div>
    </div>

    <!-- Authentication Modal -->
    <div id="auth-modal" class="auth-modal">
        <div class="auth-content">
            <h2>Authentication Required</h2>
            <p>Please authenticate with Claude to continue</p>
            <button class="auth-button" onclick="initiateAuth()">
                Login with Claude
            </button>
        </div>
    </div>

    <script>
        // ===== Configuration =====
        const SOCKET_URL = window.location.origin;

        // ===== State Management =====
        let socket = null;
        let isConnected = false;
        let isStreaming = false;
        let currentSession = null;
        let currentAssistantMessage = null;
        let messageBuffer = '';
        let messageIdCounter = 0;

        // ===== DOM Elements =====
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const statusDiv = document.getElementById('status');
        const sessionIdSpan = document.getElementById('session-id');
        const messageCountSpan = document.getElementById('message-count');
        const streamStatusSpan = document.getElementById('stream-status');
        const authModal = document.getElementById('auth-modal');

        // ===== Socket.IO Connection =====
        function initializeSocket() {
            socket = io(SOCKET_URL, {
                transports: ['websocket'],
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000
            });

            // Connection events
            socket.on('connected', handleConnected);
            socket.on('disconnect', handleDisconnect);
            socket.on('connect_error', handleConnectionError);

            // Session events
            socket.on('session_created', handleSessionCreated);
            socket.on('session_info', handleSessionInfo);

            // Message events
            socket.on('message_sent', handleMessageSent);
            socket.on('stream_start', handleStreamStart);
            socket.on('stream_event', handleStreamEvent);
            socket.on('stream_end', handleStreamEnd);

            // Error events
            socket.on('error', handleError);
        }

        // ===== Event Handlers =====
        function handleConnected(data) {
            isConnected = true;
            updateStatus('connected', 'Connected');
            sendButton.disabled = false;

            // Create session automatically
            socket.emit('create_session', {
                title: `Chat ${new Date().toLocaleTimeString()}`
            });

            console.log('Connected to server:', data);
        }

        function handleDisconnect() {
            isConnected = false;
            updateStatus('error', 'Disconnected');
            sendButton.disabled = true;
            console.log('Disconnected from server');
        }

        function handleConnectionError(error) {
            updateStatus('error', 'Connection failed');
            console.error('Connection error:', error);
        }

        function handleSessionCreated(data) {
            currentSession = data.session;
            sessionIdSpan.textContent = currentSession.id;
            messageCountSpan.textContent = '0';
            addSystemMessage(`Session created: ${currentSession.title}`);
            console.log('Session created:', currentSession);
        }

        function handleSessionInfo(data) {
            if (data.session) {
                sessionIdSpan.textContent = data.session.id;
                messageCountSpan.textContent = data.message_count || 0;
            }
        }

        function handleMessageSent(data) {
            console.log('Message sent:', data.message_id);
        }

        function handleStreamStart() {
            isStreaming = true;
            streamStatusSpan.textContent = 'Claude is typing...';

            // Create assistant message container
            if (!currentAssistantMessage) {
                currentAssistantMessage = createMessage('assistant', '');
                messageBuffer = '';
            }

            // Add streaming indicator
            const indicator = createStreamingIndicator();
            currentAssistantMessage.querySelector('.message-body').appendChild(indicator);
        }

        function handleStreamEvent(event) {
            if (!currentAssistantMessage) return;

            const messageBody = currentAssistantMessage.querySelector('.message-body');

            switch (event.type) {
                case 'message.start':
                    console.log('Message started:', event.data.id);
                    break;

                case 'message.delta':
                    // Append content to buffer
                    messageBuffer += event.data.content;

                    // Remove streaming indicator if present
                    const indicator = messageBody.querySelector('.streaming-indicator');
                    if (indicator) {
                        indicator.remove();
                    }

                    // Update message content with markdown parsing
                    messageBody.innerHTML = marked.parse(messageBuffer);

                    // Highlight code blocks
                    messageBody.querySelectorAll('pre code').forEach((block) => {
                        Prism.highlightElement(block);
                    });

                    // Auto-scroll
                    scrollToBottom();
                    break;

                case 'code.start':
                    addToolExecution(`⚙️ Running ${event.data.language || 'code'}...`);
                    break;

                case 'code.end':
                    addToolExecution('✓ Code execution complete');
                    break;

                case 'tool.start':
                    addToolExecution(`🔧 Using tool: ${event.data.name || 'unknown'}`);
                    break;

                case 'message.complete':
                    console.log('Message completed');
                    break;

                case 'error':
                    handleError(event.data);
                    break;
            }
        }

        function handleStreamEnd() {
            isStreaming = false;
            streamStatusSpan.textContent = '';
            currentAssistantMessage = null;
            messageBuffer = '';
            sendButton.disabled = false;
            messageInput.disabled = false;

            // Update message count
            const currentCount = parseInt(messageCountSpan.textContent) || 0;
            messageCountSpan.textContent = currentCount + 1;
        }

        function handleError(error) {
            console.error('Error:', error);
            addSystemMessage(`Error: ${error.message}`, 'error');
            isStreaming = false;
            sendButton.disabled = false;
            messageInput.disabled = false;
            streamStatusSpan.textContent = '';
        }

        // ===== UI Functions =====
        function updateStatus(state, text) {
            statusDiv.className = `status ${state}`;
            statusDiv.querySelector('.status-text').textContent = text;
        }

        function createMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;

            const avatar = role === 'user' ? '👤' : '🤖';
            const name = role === 'user' ? 'You' : 'Claude';

            messageDiv.innerHTML = `
                <div class="message-wrapper">
                    <div class="message-avatar">${avatar}</div>
                    <div class="message-content">
                        <div class="message-header">${name}</div>
                        <div class="message-body">${role === 'user' ? escapeHtml(content) : content}</div>
                    </div>
                </div>
            `;

            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        function addSystemMessage(content, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'system-message';
            messageDiv.style.cssText = `
                text-align: center;
                padding: 12px;
                color: var(--text-secondary);
                font-size: 14px;
                margin: 12px 0;
            `;
            messageDiv.textContent = content;
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        function addToolExecution(content) {
            const toolDiv = document.createElement('div');
            toolDiv.className = 'tool-execution';
            toolDiv.innerHTML = `
                <span class="tool-icon">⚡</span>
                <span>${content}</span>
            `;
            messagesDiv.appendChild(toolDiv);
            scrollToBottom();
        }

        function createStreamingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'streaming-indicator';
            indicator.innerHTML = `
                <span class="streaming-dot"></span>
                <span class="streaming-dot"></span>
                <span class="streaming-dot"></span>
            `;
            return indicator;
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== Message Sending =====
        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !isConnected || isStreaming) return;

            // Display user message
            createMessage('user', content);

            // Update message count
            const currentCount = parseInt(messageCountSpan.textContent) || 0;
            messageCountSpan.textContent = currentCount + 1;

            // Clear input and disable while streaming
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendButton.disabled = true;
            messageInput.disabled = true;

            // Send to server
            socket.emit('send_message', {
                content: content
            });
        }

        // ===== Authentication =====
        async function initiateAuth() {
            try {
                const response = await fetch('/auth/initiate?client_id=' + socket.id);
                const data = await response.json();

                if (data.auth_url) {
                    window.open(data.auth_url, '_blank');
                    authModal.classList.remove('show');
                }
            } catch (error) {
                console.error('Auth error:', error);
            }
        }

        // ===== Input Handling =====
        messageInput.addEventListener('input', () => {
            // Auto-resize textarea
            messageInput.style.height = 'auto';
            messageInput.style.height = messageInput.scrollHeight + 'px';
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        // ===== Keyboard Shortcuts =====
        document.addEventListener('keydown', (e) => {
            // Cmd/Ctrl + K: Clear chat
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                if (confirm('Clear chat history?')) {
                    messagesDiv.innerHTML = '';
                    addSystemMessage('Chat cleared');
                }
            }

            // Cmd/Ctrl + /: Focus input
            if ((e.metaKey || e.ctrlKey) && e.key === '/') {
                e.preventDefault();
                messageInput.focus();
            }
        });

        // ===== Initialization =====
        window.addEventListener('load', () => {
            // ===== Markdown Configuration =====
            if (typeof marked !== 'undefined') {
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (Prism.languages[lang]) {
                            return Prism.highlight(code, Prism.languages[lang], lang);
                        }
                        return code;
                    },
                    breaks: true,
                    gfm: true
                });
            }

            initializeSocket();
            messageInput.focus();
            addSystemMessage('Welcome to Claude Direct Interface. Initializing connection...');
        });

        // ===== Cleanup =====
        window.addEventListener('beforeunload', () => {
            if (socket) {
                socket.disconnect();
            }
        });
    </script>
</body>
</html>
